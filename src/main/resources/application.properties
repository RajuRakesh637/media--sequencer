spring.application.name=media-sequencer
server.port=8080

# PostgreSQL Configuration with Environment Variable Fallbacks (for Local, Docker, and Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/media_sequencer}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0000}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Initialization (allow data.sql to run after Hibernate creates/updates tables)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
